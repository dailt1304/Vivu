sonar.projectKey=vivuappfe
sonar.projectName=VivuApp Frontend
sonar.projectVersion=1.0

# Source
sonar.sources=src
sonar.exclusions=src/**/__tests__/**, src/test/**, src/main.jsx, src/App.jsx

# Tests
sonar.tests=src
sonar.test.inclusions=src/**/__tests__/**, src/**/*.test.js, src/**/*.test.jsx
sonar.test.exclusions=src/test/setup.js

# Language
sonar.language=js
sonar.sourceEncoding=UTF-8

# Coverage (lcov từ Phase 1)
sonar.javascript.lcov.reportPaths=test-reports/coverage/lcov.info

# Test results
sonar.testExecutionReportPaths=test-reports/sonar-report.xml
